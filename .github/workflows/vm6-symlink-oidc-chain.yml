name: VM6 Symlink OIDC Chain
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
jobs:
  prove-trusted-main-oidc:
    runs-on: ubuntu-latest
    steps:
      - name: Request OIDC token and print claims only
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vm6-symlink-oidc-chain")"
          token="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          printf '%s' "$token" | python3 -c 'import base64,json,sys; t=sys.stdin.read().strip(); p=t.split(".")[1]; p += "="*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p)); keys=["iss","aud","sub","repository","repository_id","ref","sha","actor","event_name","workflow","job_workflow_ref"]; print(json.dumps({k:c.get(k) for k in keys},sort_keys=True))'
